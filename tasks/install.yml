---
- name: Install snapd
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true
  become: true
  tags: [multipass.dependencies]

- name: Start and enable snapd
  ansible.builtin.service:
    name: snapd
    state: started
    enabled: true
  become: true
  tags: [multipass.dependencies]

- name: Install Multipass snap
  community.general.snap:
    name: multipass
    channel: "{{ multipass_snap_channel }}"
    state: present
  register: multipass_snap_install
  until: multipass_snap_install is succeeded
  retries: 3
  delay: 5
  become: true
  tags: [multipass.install]
