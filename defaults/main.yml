---
# Snap channel to install and track.
multipass_snap_channel: latest/stable

# client.primary-name is specific to the user running the Multipass client.
multipass_client_user: root

# Set a value to manage the setting; null leaves it unchanged.
multipass_client_primary_name: null
multipass_local_bridged_network: null
multipass_local_privileged_mounts: null
multipass_local_passphrase: null
