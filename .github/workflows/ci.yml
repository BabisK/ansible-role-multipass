---
name: Ansible checks
on: [push, pull_request]
jobs:
  renovate-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate renovate.json
        run: npx --yes --package renovate -- renovate-config-validator --strict
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
  syntax:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            requirements: requirements-ci-min.txt
            collections: collections/requirements-min.yml
          - requirements: requirements-ci.txt
            collections: ci/requirements.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible-role-multipass
      - uses: actions/setup-python@v5
        if: matrix.requirements == 'requirements-ci-min.txt'
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-python@v5
        if: matrix.requirements == 'requirements-ci.txt'
        with:
          python-version: '3.15'
      - run: pip install -r '${{ matrix.requirements }}'
        working-directory: ansible-role-multipass
      - run: ansible-galaxy collection install -r '${{ matrix.collections }}'
        working-directory: ansible-role-multipass
      - run: ansible-playbook -i tests/inventory tests/test.yml --syntax-check
        working-directory: ansible-role-multipass
        env:
          ANSIBLE_ROLES_PATH: ..
