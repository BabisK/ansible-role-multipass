name: Publish role to Ansible Galaxy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-role-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install Ansible
        run: python -m pip install -r requirements-ci.txt
      - name: Import role into Ansible Galaxy
        env:
          ANSIBLE_GALAXY_SERVER_LIST: galaxy
          ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
          ANSIBLE_GALAXY_SERVER_GALAXY_TOKEN: ${{ secrets.GALAXY_API_TOKEN }}
        run: |
          if [ -z "$ANSIBLE_GALAXY_SERVER_GALAXY_TOKEN" ]; then
            echo '::error::The GALAXY_API_TOKEN Actions secret is not configured.'
            exit 1
          fi
          ansible-galaxy role import BabisK ansible-role-multipass
